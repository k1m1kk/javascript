<script>
class Pankki {
  constructor(tilinumero) {
   this.tilinumero = tilinumero;
   this.saldo = 0;
   this.historia = [];
}

talleta(summa) {
  let saldoEnnen = this.saldo;
  this.saldo += summa;

  this.historia.push({
   paiva: new Date(),
   tapahtuma: "talletus",
   summa: summa,
   saldoEnnen: saldoEnnen
 });

}

nosta(summa) {
  if (summa > this.saldo) {
   console.log("Nosto epäonnistui: ei tarpeeksi saldoa");
   return;
 }

 let saldoEnnen = this.saldo;
 this.saldo -= summa;
 }
}
 class TarkistavaPankki extends Pankki {

onkoTarpeeksiRahaa(summa) {
  return this.saldo >= summa;
}

onkoTilinumeroKelvollinen() {
  return this.tilinumero.length >= 10;
 }
}

class LuottoPankki extends TarkistavaPankki

 lisaaKorko(prosentti) {
   let korko = this.saldo * (prosentti / 100);
   let.saldo += korko;
}

 voikoSaadaLuotttoa(summa) {
    let nettotulot = Number(prompt("Anna kuukausittaiset nettotulot (€):"));
    let maxLuotto = nettotulot * 0,25;

    return summa <= max Luotto
 }
}

class LaajennettuPankki extend Pankki


 laskeTuotto() {
   let vuodet = Number(prompt("Anna vuosien määrä"));
   let saldo = this.saldo;

  for (let i = 0; i < vuodet; i++) {
    saldo *= 1.01;
  }

  return saldo - this.saldo;
 }


suurinSaldo() {
  let max = this.saldo;

  for (let tapahtuma of this.historia) {
    if (tapahtuma.saldoEnnen > max) {
      max = tapahtuma.saldoEnnen;
    }
  }
 return max
}


kuukausiYhteenveto(kuukausi) {
 let talletukset = 0;
 let nostot = 0;

 for (let t of this.historia) {
  if (t.paiva.getMonth() === kuukausi) {
   if (t.tapahtuma === "Talletus") {
     talletukset += t.summa;
   }
   if (t.tapahtuma === "Nostot") {
    nostot += t.summa;
   }
  }
 }

 return {
  talletukset: talletukset
   nostot: nostot
 };
}


tallennaTiedostoon() {
 cons fs = require("fs");

 cons data = {

 };

 fs.writeFileSync("tili.json", JSON.stringfy(data, null, 2));
 }
 }

naytaTiedot() {
  document.write("<h3>Pankkitilin tiedot</h3>");
  document.write("Tilinumero: " + this.tilinumero + "<br>");
  document.write("Saldo: " + this.saldo + " €<br><br>");

}

naytaHistoria() {
  document.write("<h4>Tapahtumahistoria</h4>");

  if (this.historia.length === 0) {
    document.write("Ei tapahtumia<br>");
    return;
}

 for (let tapahtuma of this.historia) {

    );
